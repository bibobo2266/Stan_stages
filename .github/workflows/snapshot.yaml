name: Weekly snapshot

on:
  schedule:
    # 週六 01:00 UTC = 台北週六 09:00（週線收完，行情 parquet 也已更新）
    - cron: '0 1 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pandas numpy requests pyarrow

      - name: Snapshot stages
        run: python scripts/snapshot.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "stages $(date +%Y-%m-%d)"
          git push
