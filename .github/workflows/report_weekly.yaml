name: Report - Stan (weekly)

# 放在 Stan_stages 而不是 minervini_picks：
#   stages.parquet 就在同一個 repo，checkout 完就有。原本放在 minervini_picks
#   要跨 repo 抓 raw，得留緩衝等對面 commit + raw 快取更新，時間只能用猜的。
#   串 workflow_run 之後，snapshot 一 commit 完就跑，不用猜。
#
# 需要在這個 repo 設三個 secrets（跟 minervini_picks 那邊同名）：
#   GMAIL_USER / GMAIL_APP_PASSWORD / MAIL_TO

# 2026-11-23 Owner：同一週被寄兩次 → 停用 workflow_run 自動觸發，只留 cron-job.org 呼叫的 workflow_dispatch。
on:
  workflow_dispatch:
    inputs:
      top:
        description: '每張表最多列幾檔'
        default: '20'

permissions:
  contents: read

concurrency:
  group: report-weekly
  cancel-in-progress: false

jobs:
  report:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # pandas 3.0 的 to_datetime 不再自動推斷混合格式，讀 parquet 的字串
      # date 欄會 ValueError，所以鎖版本。
      - run: pip install "pandas<3" "numpy<3" requests pyarrow

      - name: Build report
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: python -u scripts/report_stan.py --top ${{ inputs.top || 20 }}

      - name: Send mail (HTML body, CSV attachments, one copy)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          test -s out/summary.html
          python scripts/send_html_mail.py --file out/summary.html --subject "Stan 階段週報｜$(TZ=Asia/Taipei date +%F)" --from-name "Stan Stages" --attach out/*.csv
